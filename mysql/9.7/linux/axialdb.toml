# Copy to /etc/axialdb/axialdb.toml
# AXIALDB_CONFIG=/etc/axialdb/axialdb.toml for mysqld and for axialdb-engine.service.
# [cdc] port is 3306. Change it if MySQL listens elsewhere.
# Live views: set enabled = true only after the replication user exists.
# Free version terms: TERMS.md in this zip.

[data]
axialdb_data_dir = "/var/lib/axialdb/data"

[helper]
# Sidecar runs as systemd axialdb-engine.service (required). mysqld only probes helper.listen.
auto_spawn = false
service_name = "axialdb-engine"
executable = "/usr/local/axialdb/axialdb-engine"
listen = "127.0.0.1:9742"

[catalog]
database = "catalog.db"

[retention]
unused_days = 30
janitor_interval_secs = 3600
dry_run = false

[engine]
target_partitions = 0

[engine.tuning]
batch_size = 8192
skip_partial_agg_probe_rows = 100
skip_partial_agg_probe_ratio = 0.8
parquet_pruning = true
ipc_coalesce_target_rows = 65536

[parquet]
max_row_group_size_bytes = 262144
compression = "zstd"

[execution]
embedded_enabled = false
default_execution = "sidecar"
default_cardinality = "auto"
default_materialization = "snapshot"

[ipc]
query_timeout_secs = 300
server_query_timeout_secs = 30

[logging]
level = "info"
file = "/var/log/axialdb/axialdb-engine.log"

[license]
# Free zip. Paid: copy axialdb.lic beside this file and restart the engine.
max_views = 5
max_cdc_views = 2

[cdc]
# Binlog capture. Leave off until you create a replication user and set password.
# GRANT REPLICATION SLAVE, REPLICATION CLIENT, SELECT ON *.* TO 'axialdb_cdc'@'127.0.0.1';
enabled = false
host = "127.0.0.1"
port = 3306
user = "axialdb_cdc"
password = ""
server_id = 19001
interval_secs = 1
tls = false
